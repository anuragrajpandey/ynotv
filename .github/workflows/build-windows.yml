name: Build Windows App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.1.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install

      - name: Prepare UI build for CI packaging
        shell: bash
        run: |
          set -e
          pnpm --filter @ynotv/ui add react-virtuoso@latest
          node <<'NODE'
          const fs = require('fs');
          const path = 'packages/ui/package.json';
          const data = JSON.parse(fs.readFileSync(path, 'utf8'));
          const script = data.scripts?.build || '';
          const expected = 'node ../../scripts/check-globals.mjs && node ../../scripts/audit-tokens.mjs && node ../../scripts/check-css.mjs src && tsc && vite build';
          const replacement = 'node ../../scripts/check-globals.mjs && node ../../scripts/audit-tokens.mjs && node ../../scripts/check-css.mjs src && vite build';
          if (script !== expected) throw new Error(`Unexpected @ynotv/ui build script: ${script}`);
          data.scripts.build = replacement;
          fs.writeFileSync(path, JSON.stringify(data, null, 2) + '\n');
          console.log('CI UI build prepared: Vite bundle enabled, TypeScript gate skipped.');
          NODE

      - name: Download FFmpeg
        shell: bash
        run: |
          set -e
          cd packages/app
          node scripts/download-ffmpeg.js
          cd ../..

      - name: Download MPV
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAURI_BIN_DIR="packages/app/src-tauri/bin"
          mkdir -p "$TAURI_BIN_DIR"
          MPV_URL=$(gh api repos/shinchiro/mpv-winbuild-cmake/releases/latest --jq '.assets[] | select(.name | test("^mpv-x86_64-[0-9]")) | .browser_download_url' | head -n 1)
          if [ -z "$MPV_URL" ]; then echo "ERROR: Could not find MPV x86_64 download."; exit 1; fi
          TEMP_DIR=$(mktemp -d)
          curl -L --fail -o "$TEMP_DIR/mpv.7z" "$MPV_URL"
          7z x "$TEMP_DIR/mpv.7z" -o"$TEMP_DIR/mpv-extract" -y
          MPV_EXE=$(find "$TEMP_DIR/mpv-extract" -type f -iname "mpv.exe" | head -n 1)
          if [ -z "$MPV_EXE" ]; then echo "ERROR: mpv.exe was not found."; exit 1; fi
          cp "$MPV_EXE" "$TAURI_BIN_DIR/mpv-x86_64-pc-windows-msvc.exe"
          find "$TEMP_DIR/mpv-extract" -type f -iname "*.dll" -exec cp {} "$TAURI_BIN_DIR/" \;

      - name: Download libmpv runtime and import library
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location "packages/app/src-tauri"
          & powershell -ExecutionPolicy Bypass -File .\setup-libmpv.ps1
          if (-not (Test-Path .\libmpv\libmpv-2.dll)) { throw "libmpv-2.dll was not created." }
          $mpvLib = Get-ChildItem .\libmpv -Filter mpv.lib -Recurse | Select-Object -First 1
          if (-not $mpvLib) { throw "mpv.lib was not created." }

      - name: Download Vulkan runtime
        shell: bash
        run: |
          set -e
          TAURI_BIN_DIR="packages/app/src-tauri/bin"
          TEMP_DIR=$(mktemp -d)
          mkdir -p "$TAURI_BIN_DIR"
          curl -L --fail -o "$TEMP_DIR/vulkan-runtime.zip" "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-runtime-components.zip"
          7z x "$TEMP_DIR/vulkan-runtime.zip" -o"$TEMP_DIR/vulkan-extract" -y
          VULKAN_DLL=$(find "$TEMP_DIR/vulkan-extract" -type f -iname "vulkan-1.dll" | head -n 1)
          if [ -z "$VULKAN_DLL" ]; then echo "ERROR: vulkan-1.dll was not found."; exit 1; fi
          cp "$VULKAN_DLL" "$TAURI_BIN_DIR/vulkan-1.dll"
          VULKAN_LICENSE=$(find "$TEMP_DIR/vulkan-extract" -type f \( -iname "VulkanRT-License.txt" -o -iname "*license*.txt" \) | head -n 1)
          if [ -n "$VULKAN_LICENSE" ]; then cp "$VULKAN_LICENSE" "$TAURI_BIN_DIR/VulkanRT-License.txt"; else echo "Vulkan Runtime License" > "$TAURI_BIN_DIR/VulkanRT-License.txt"; fi

      - name: Download yt-dlp
        shell: bash
        run: |
          set -e
          TAURI_BIN_DIR="packages/app/src-tauri/bin"
          mkdir -p "$TAURI_BIN_DIR"
          curl -L --fail -o "$TAURI_BIN_DIR/yt-dlp-x86_64-pc-windows-msvc.exe" "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe"

      - name: Verify Tauri binaries
        shell: bash
        run: |
          set -e
          TAURI_BIN_DIR="packages/app/src-tauri/bin"
          for FILE in mpv-x86_64-pc-windows-msvc.exe ffmpeg-x86_64-pc-windows-msvc.exe yt-dlp-x86_64-pc-windows-msvc.exe vulkan-1.dll VulkanRT-License.txt; do
            test -f "$TAURI_BIN_DIR/$FILE" || { echo "ERROR: Missing $FILE"; exit 1; }
            echo "OK: $FILE"
          done

      - name: Verify libmpv files
        shell: bash
        run: |
          set -e
          test -f "packages/app/src-tauri/libmpv/libmpv-2.dll"
          test -f "packages/app/src-tauri/libmpv/mpv.lib"
          echo "OK: libmpv-2.dll"
          echo "OK: mpv.lib"

      - name: Create unsigned CI Tauri config
        shell: bash
        run: |
          set -e
          node <<'NODE'
          const fs = require('fs');
          const path = 'packages/app/tauri.ci.conf.json';
          fs.writeFileSync(path, JSON.stringify({ bundle: { createUpdaterArtifacts: false } }, null, 2) + '\n');
          console.log(`Created ${path}`);
          NODE
          cat packages/app/tauri.ci.conf.json

      - name: Build Windows app
        run: pnpm tauri build --config tauri.ci.conf.json

      - name: Verify Windows installer
        shell: bash
        run: |
          set -e
          BUNDLE_DIR="packages/app/src-tauri/target/release/bundle"
          INSTALLER=$(find "$BUNDLE_DIR" -maxdepth 3 -type f -path "*/nsis/*.exe" -print -quit)
          echo "Generated Windows installers:"
          find "$BUNDLE_DIR" -maxdepth 3 -type f -iname "*.exe" -print
          if [ -z "$INSTALLER" ]; then echo "ERROR: NSIS Windows installer was not generated."; exit 1; fi
          echo "OK: $INSTALLER"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Windows-App
          path: packages/app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
